name: SoSoValue ETF candidate preview

# Read-only evidence gate. This does not authorize production activation.

on:
  workflow_dispatch:
    inputs:
      as_of_utc:
        description: Explicit ISO 8601 timestamp with Z or a numeric offset. Example only, 2026-09-24T13:16:42.928Z.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        env:
          CAPTURE_REF: ${{ github.ref }}
        run: |
          if [ "$CAPTURE_REF" != "refs/heads/main" ]; then
            echo "Candidate preview must be dispatched against refs/heads/main"
            exit 1
          fi

  preview:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20.18.0"

      - name: Require origin/main before preview
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "origin/main no longer equals GITHUB_SHA"
            exit 1
          fi

      - name: Preview ETF candidate
        env:
          AS_OF_UTC: ${{ inputs.as_of_utc }}
        run: |
          node scripts/etl/preview-sosovalue-etf-candidate.mjs \
            --as-of-utc "$AS_OF_UTC" \
            --repository-sha "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/sosovalue-etf-candidate-preview-report.json"

      - name: Require origin/main after preview
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "origin/main advanced during preview"
            exit 1
          fi

      - name: Upload candidate preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sosovalue-etf-candidate-preview
          path: ${{ runner.temp }}/sosovalue-etf-candidate-preview-report.json
          if-no-files-found: warn

      - name: Confirm repository worktree stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            exit 1
          fi
