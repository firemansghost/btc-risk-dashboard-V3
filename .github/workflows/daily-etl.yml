name: Daily ETL

on:
  workflow_dispatch:
  schedule:
    # 11:00 UTC ≈ 06:00 America/Chicago most of the year; adjust if desired
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20.18.0"

      - name: Install deps
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Initialize H8 capture gate
        run: |
          echo "H8_CAPTURE_ALLOWED=false" >> "$GITHUB_ENV"
          echo "H8_CAPTURE_COMPLETED=false" >> "$GITHUB_ENV"
          echo "H8_PRODUCTION_OK=false" >> "$GITHUB_ENV"

      - name: H8 identity preflight
        if: github.event_name == 'schedule' && github.run_attempt == 1
        continue-on-error: true
        run: |
          set +e
          node scripts/research/capture-h8-prospective.mjs --contract-check
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "H8_CAPTURE_ALLOWED=true" >> "$GITHUB_ENV"
            echo "H8 preflight PASS" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "H8_CAPTURE_ALLOWED=false" >> "$GITHUB_ENV"
            echo "H8 preflight BLOCKED — production ETL continues" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Record H8 ETL start UTC
        run: |
          echo "H8_ETL_STARTED_UTC=$(node -e 'process.stdout.write(new Date().toISOString())')" >> "$GITHUB_ENV"

      - name: Run ETL compute (with self-check)
        run: npm run etl:compute
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        working-directory: .

      - name: Print social_interest status
        run: |
          if [ -f public/data/status.json ]; then
            echo "=== social_interest status ==="
            jq '.factors.social_interest // .social_interest | {status, last_updated_utc}' public/data/status.json || echo "Could not parse status.json"
          else
            echo "status.json not found"
          fi
        continue-on-error: true

      - name: Configure git
        run: |
          git config user.name "ghostgauge-bot"
          git config user.email "bot@ghostgauge.local"

      - name: H8 prospective capture
        if: github.event_name == 'schedule' && github.run_attempt == 1 && env.H8_CAPTURE_ALLOWED == 'true'
        continue-on-error: true
        env:
          H8_GITHUB_RUN_ID: ${{ github.run_id }}
          H8_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          H8_GITHUB_EVENT_NAME: ${{ github.event_name }}
          H8_GITHUB_SHA: ${{ github.sha }}
          H8_GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          H8_CREATED_MANIFEST_PATH: ${{ runner.temp }}/h8-created-manifest.json
          H8_ESCROW_DIR: ${{ runner.temp }}/h8-escrow
        run: |
          set +e
          node scripts/research/capture-h8-prospective.mjs --capture
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "H8_CAPTURE_COMPLETED=true" >> "$GITHUB_ENV"
            echo "H8 capture created artifacts (not yet committed)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "H8_CAPTURE_COMPLETED=false" >> "$GITHUB_ENV"
            echo "H8 capture BLOCKED/FAILED — production ETL continues; no H8 commit" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Escrow H8 artifacts
        if: env.H8_CAPTURE_COMPLETED == 'true'
        continue-on-error: true
        env:
          H8_CREATED_MANIFEST_PATH: ${{ runner.temp }}/h8-created-manifest.json
          H8_ESCROW_DIR: ${{ runner.temp }}/h8-escrow
        run: |
          set +e
          node --input-type=module -e "import { runEscrowPhase } from './scripts/research/lib/h8-prospective-capture-io.mjs'; runEscrowPhase();"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "H8_CAPTURE_COMPLETED=false" >> "$GITHUB_ENV"
            echo "H8 escrow failed — production continues; H8 will not commit" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Commit production artifacts
        run: |
          git add -A public/data public/signals public/extras public/alerts
          if git diff --cached --name-only | grep -E '^research/'; then
            echo "STOP: research paths must never be staged in the production commit"
            git restore --staged --worktree -- research || true
            echo "H8_PRODUCTION_OK=false" >> "$GITHUB_ENV"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No production changes"
            git fetch origin
            git pull --rebase origin main || {
              echo "Rebase failed, trying merge instead..."
              git pull origin main
            }
            echo "H8_PRODUCTION_OK=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m "chore(etl): update artifacts [skip ci]"

          echo "Pulling latest changes..."
          git pull --rebase origin main || {
            echo "Rebase failed, trying merge instead..."
            git pull origin main
          }

          PUSHED=false
          for i in 1 2 3; do
            echo "Attempt $i to push production changes..."
            if git push origin main; then
              echo "Production push successful!"
              PUSHED=true
              break
            fi
            echo "Production push failed, pulling again and retrying..."
            git pull --rebase origin main || git pull origin main
            sleep 5
          done
          if [ "$PUSHED" != "true" ]; then
            echo "Production push failed after retries"
            echo "H8_PRODUCTION_OK=false" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "H8_PRODUCTION_OK=true" >> "$GITHUB_ENV"

      - name: H8 scientific commit
        if: env.H8_CAPTURE_COMPLETED == 'true' && env.H8_PRODUCTION_OK == 'true'
        continue-on-error: true
        env:
          H8_CREATED_MANIFEST_PATH: ${{ runner.temp }}/h8-created-manifest.json
          H8_ESCROW_DIR: ${{ runner.temp }}/h8-escrow
        run: |
          # research(h8): capture prospective artifacts [skip ci]
          set +e
          node --input-type=module -e "import { runH8ScientificPhase } from './scripts/research/lib/h8-prospective-capture-io.mjs'; runH8ScientificPhase();"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "H8 scientific commit/push complete" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "H8 scientific commit/push FAILED CLOSED — production update remains landed" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
