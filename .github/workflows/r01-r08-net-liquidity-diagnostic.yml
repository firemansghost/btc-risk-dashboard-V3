name: R01/R08 Net Liquidity source-date-cache diagnostic

# Read-only evidence only. Does not authorize production Net Liquidity repair
# (units, date-join, cache invalidation, or missingness). Do not adjudicate
# a successor production design from this workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        env:
          DIAGNOSTIC_REF: ${{ github.ref }}
        run: |
          if [ "$DIAGNOSTIC_REF" != "refs/heads/main" ]; then
            echo "R01/R08 Net Liquidity diagnostic must be dispatched against refs/heads/main"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20.18.0"

      - name: Require FRED_API_KEY
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "FRED_API_KEY secret is required"
            exit 1
          fi

      - name: Require origin/main before diagnostic
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "origin/main no longer equals GITHUB_SHA"
            exit 1
          fi

      - name: Run R01/R08 Net Liquidity diagnostic
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          node scripts/research/diagnose-r01-r08-net-liquidity.mjs \
            --repository-sha "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/r01-r08-net-liquidity-diagnostic-report.json"

      - name: Require origin/main after diagnostic
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "origin/main advanced during diagnostic"
            exit 1
          fi

      - name: Upload R01/R08 diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r01-r08-net-liquidity-diagnostic
          path: ${{ runner.temp }}/r01-r08-net-liquidity-diagnostic-report.json
          if-no-files-found: warn

      - name: Confirm repository worktree stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            exit 1
          fi
