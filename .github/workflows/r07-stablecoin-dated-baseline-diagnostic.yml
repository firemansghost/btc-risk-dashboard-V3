name: R07-D Stablecoin dated baseline feasibility

# Read-only evidence only. This does not authorize a production Stablecoin repair,
# endpoint policy, lag tolerance, or candidate baseline migration.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        env:
          DIAGNOSTIC_REF: ${{ github.ref }}
        run: |
          if [ "$DIAGNOSTIC_REF" != "refs/heads/main" ]; then
            echo "R07-D dated baseline diagnostic must be dispatched against refs/heads/main"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20.18.0"

      - name: Require origin/main before diagnostic
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "origin/main no longer equals GITHUB_SHA"
            exit 1
          fi

      - name: Run R07-D dated Stablecoin baseline feasibility diagnostic
        run: |
          node scripts/research/diagnose-r07-stablecoin-dated-baseline.mjs \
            --repository-sha "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/r07-d-dated-baseline-feasibility-report.json"

      - name: Require origin/main after diagnostic
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "origin/main advanced during diagnostic"
            exit 1
          fi

      - name: Upload R07-D feasibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r07-d-stablecoin-dated-baseline-feasibility
          path: ${{ runner.temp }}/r07-d-dated-baseline-feasibility-report.json
          if-no-files-found: warn

      - name: Confirm repository worktree stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            exit 1
          fi
