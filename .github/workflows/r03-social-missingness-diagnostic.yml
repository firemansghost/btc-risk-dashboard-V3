name: R03 Social missingness treatment diagnostic

# Read-only offline evidence only. Does not authorize production Social
# missingness, cache, reweight, or model-version repair. Do not adjudicate
# a successor production treatment from this workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        env:
          DIAGNOSTIC_REF: ${{ github.ref }}
        run: |
          if [ "$DIAGNOSTIC_REF" != "refs/heads/main" ]; then
            echo "R03 Social missingness diagnostic must be dispatched against refs/heads/main"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Require origin/main before diagnostic
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "origin/main no longer equals GITHUB_SHA"
            exit 1
          fi

      - name: Run R03 Social missingness diagnostic
        run: |
          node scripts/research/diagnose-r03-social-missingness.mjs \
            --repository-sha "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/r03-social-missingness-diagnostic-report.json"

      - name: Require origin/main after diagnostic
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "origin/main advanced during diagnostic"
            exit 1
          fi

      - name: Upload R03 diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: r03-social-missingness-diagnostic
          path: ${{ runner.temp }}/r03-social-missingness-diagnostic-report.json
          if-no-files-found: warn

      - name: Confirm repository worktree stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            exit 1
          fi
