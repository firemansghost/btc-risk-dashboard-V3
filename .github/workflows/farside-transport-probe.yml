name: Farside transport probe

on:
  push:
    branches:
      - probe/farside-wordpress-transport

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20.18
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'

      - name: Probe Farside transport and payload shape
        run: node scripts/admin/farside-transport-probe.mjs
